# Sistema live de estrategias de Carver - Darwinex MT5 (cuenta hedge en EUR)
# Las rutas relativas son relativas a esta carpeta (live/).

[general]
mode = "live"           # "dry_run": calcula y registra sin enviar órdenes | "live": opera de verdad
poll_seconds = 5
state_dir = "state"     # bloqueos (locks.json) y aprobaciones de saltos de precio
log_dir = "logs"        # live.log, acciones.csv, estado_diario.csv
stop_file = "STOP"      # si existe: cancela pendientes y no opera; si contiene "flat" además cierra posiciones

[account]
capital = 1700          # EUR asignados; se usa min(capital, equity). "equity" = todo el equity (interés compuesto)
risk_target = 0.20      # tau anual (AFTS)
idm = "auto"            # "auto" = tabla de AFTS según nº de cruces activos (5 -> 1.70), o un número

[safety]
max_trades_per_day = 30     # por asignación; si se supera, se bloquea
spike_sigma = 8.0           # cierre diario que se mueve > N desviaciones -> bloqueo hasta aprobar
max_tick_age_seconds = 120  # sin ticks nuevos durante este tiempo -> no se opera (fin de semana, caída)
deviation_points = 20       # deslizamiento máximo de las órdenes a mercado
max_spread_mult = 3.0       # no ir a mercado si el spread > N × el spread de referencia
liquid_hours = ["10:00", "18:00"]  # referencia = spread mediano de estas horas (Londres/NY), hora servidor
reference_days = 5          # días de ticks para calcular la referencia (se recalcula cada día)
market_hours = ["01:00", "23:45"]  # horario para órdenes a mercado NO urgentes (nivel ya ejecutable)
max_forced_wait_hours = 10  # una reducción obligatoria espera spread normal como mucho estas horas
min_history_days = 500      # velas D1 mínimas (la vol usa media de 10 años y percentil histórico)
blackout_start = "23:45"    # hora del SERVIDOR (Darwinex GMT+2/+3: medianoche = cierre de NY).
blackout_end = "01:00"      # en la ventana se cancelan las pendientes y no se opera (spreads de rollover)

[risk_overlay]          # AFTS táctica 4: multiplicador <= 1 sobre TODAS las posiciones si el riesgo se dispara
enabled = true
max_risk = 0.35         # riesgo anual esperado de la cartera (vol actual y correlaciones de 2 años)
max_jump_risk = 1.10    # el mismo con cada vol en su percentil 99 histórico
max_corr_shock = 0.60   # suma de riesgos como si todas las correlaciones fueran +-1
max_leverage = 10.0     # nominal total / capital
corr_days = 500
quantum = 0.05          # el multiplicador se redondea hacia abajo a múltiplos de 0.05
# Máximos = percentil 99 del backtest S27 2010-2025 con los 5 pares (IDM 1.70): 0.35 / 1.10 / 0.58 / 9.5

[mt5]
path = ""               # ruta a terminal64.exe si hay varios terminales; vacío = el que está abierto
expect_server = "Darwinex-Demo"  # se niega a operar si el terminal está en otro servidor (cuenta real: cambiarlo a mano)

[strategies.s27]
magic = 270001
eq_span = 5             # equilibrio: EWMA de cierres diarios
forecast_scalar = 20.0  # AFTS: 20 para la 27 (9.3 en la 26)
forecast_cap = 20.0
trend_fast = 16         # filtro de tendencia EWMAC(16,64) diario
trend_slow = 64
vol_attenuation = true  # multiplicador M = EWMA10(2 - 1.5 Q). En el backtest del repo no aportaba
execution = "limit"     # "limit": escalera de órdenes límite del libro | "market": a mercado cada vela H1
buffer_fraction = 1.0   # limit: cada orden = esta fracción de la posición media (mín. 1 paso = escalera del libro)
                        # market: buffer. Backtest 2010-2025, 4 pares, límites cruzando ½ spread, sin comisión:
                        # Sharpe -0.35 (0.25), 0.00 (0.5), 0.24 (1.0), 0.29 (1.5)

# Una sección [[assignment]] por (estrategia, cruce).
#   sides: "both" | "long" | "short" | "none"   (lados permitidos)
#   mode:  "normal" | "reduce_only" (solo reducir) | "close" (cerrar y no abrir)
#   weight: peso de instrumento (si se omite en todas, reparto igual entre las activas)
#   size_mult: multiplicador manual de tamaño; max_lots: tope duro de posición
#   market_hours: ["HH:MM", "HH:MM"] propio del par (si no, el de [safety])
#   enabled: false para desactivar sin borrar (las posiciones abiertas quedan sin gestionar)

[[assignment]]
strategy = "s27"
symbol = "EURUSD"
sides = "both"
mode = "normal"
max_lots = 0.10
enabled = true

[[assignment]]
strategy = "s27"
symbol = "USDJPY"
sides = "both"
mode = "normal"
max_lots = 0.10
enabled = true

[[assignment]]
strategy = "s27"
symbol = "EURCHF"
sides = "both"
mode = "normal"
max_lots = 0.10
enabled = true

[[assignment]]
strategy = "s27"
symbol = "USDCAD"
sides = "both"
mode = "normal"
max_lots = 0.10
enabled = true

[[assignment]]
strategy = "s27"
symbol = "EURNOK"
sides = "both"
mode = "normal"
max_lots = 0.10
market_hours = ["10:00", "22:00"]   # de madrugada su spread es 2-7 veces el de Londres
enabled = true
